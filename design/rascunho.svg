<text x="54" y="895" font-size="14" fill="#52675f">Curva acumulada e referência de 80%. Não representa uma meta de qualidade</text>
<text x="36" y="980" font-size="15">Grão: uma AIH. Geografia: residência registrada. Fonte dos gráficos: marts da camada Ouro.</text>
<text x="36" y="1006" font-size="14">O painel final e o relatório publicado estão disponíveis nos links do README.</text>
