[project]
name = "pipeline-saude-sus"
version = "0.1.0"
description = "Pipeline das internacoes hospitalares do SUS (SIH): do .dbc ao dashboard por estado."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyreaddbc>=1.0",
    "dbfread>=2.0",
    "pyarrow>=14.0",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
# Fora da medicao: a tela (app.py, conferida no navegador) e os scripts de I/O
# externo (baixam da internet, nao se testa com dado inventado). A cobertura
# mede a logica do pipeline: ingestao, transformacao, marts e painel.
omit = ["test/*", "app.py", "baixar_dados.py", "gerar_dicionarios.py", ".venv/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
