[project]
name = "pipeline-saude-sus"
version = "0.1.0"
description = "Pipeline das internacoes hospitalares do SUS (SIH): do .dbc ao dashboard por estado."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyreaddbc>=1.0",
    "dbfread>=2.0",
    "pyarrow>=14.0",
    "streamlit>=1.30",
    "plotly>=7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
# 120 em vez de 88/100: acomoda SQL inline nos testes e chamadas de plotting
# sem mutilar strings, mantendo o linter util para o que importa (F, I).
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle (imports e variaveis sem uso, estilo);
# I: ordena imports. Mantem o linter util sem brigar com o estilo do projeto.
select = ["E", "F", "I"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
# Inclui download, dicionários e orquestração; exclui somente interfaces e testes.
omit = ["test/*", "app.py", "ui.py", ".venv/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
