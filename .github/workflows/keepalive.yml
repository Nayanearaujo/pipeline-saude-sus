name: Keep-Alive · Acordar Dashboard Streamlit

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/keepalive.yml", "scripts/verificar_dashboard.cjs"]

permissions:
  contents: read

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Verificar painel e solicitar inicializacao
        run: node scripts/verificar_dashboard.cjs
      - name: Guardar diagnostico em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-keepalive
          path: diagnostico-keepalive/
          retention-days: 7
