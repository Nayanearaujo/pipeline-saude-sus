name: Keep-Alive · Acordar Dashboard Streamlit

on:
  schedule:
    # Roda a cada 6 horas para manter o app acordado no Streamlit Community Cloud
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Visitar o dashboard e acordar se estiver hibernando
        run: |
          node -e '
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto("https://pipeline-saude-sus.streamlit.app/", {
              waitUntil: "networkidle",
              timeout: 90000
            });
            const wakeBtn = page.locator("button:has-text(\"Yes, get this app back up\")");
            if (await wakeBtn.count() > 0) {
              console.log("App estava hibernando. Clicando para acordar...");
              await wakeBtn.click();
              await page.waitForTimeout(25000);
            } else {
              console.log("Dashboard Streamlit ja esta acordado e respondendo.");
            }
            await browser.close();
          })();
          '
