name: CI · Testes e Qualidade de Código

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6

      - name: Sincronizar dependências
        run: uv sync

      - name: Lint e estilo (Ruff)
        run: uv run ruff check .

      - name: Testes unitários e cobertura (pytest, mínimo 95%)
        run: uv run pytest --cov
